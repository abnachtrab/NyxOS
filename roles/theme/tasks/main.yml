---
# Renders nyx_palette into every consumer format. Adding an application
# means adding a template plus a line in nyx_theme_targets, not editing
# colors in a second place.

- name: Theme directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0755"
  loop:
    - "/home/{{ nyx_user }}/.config/nyxos"
    - "/home/{{ nyx_user }}/.config/hypr/conf.d"
    - "/home/{{ nyx_user }}/.config/kitty"
    - "/home/{{ nyx_user }}/.config/waybar"

- name: Render palette into each consumer format
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest | replace('~', '/home/' + nyx_user) }}"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  loop: "{{ nyx_theme_targets }}"
  loop_control:
    label: "{{ item.dest }}"
