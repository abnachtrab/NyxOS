---
# Cirra palette. Single source of truth for every themed surface.
# roles/theme renders this into per-application formats; nothing else should
# hardcode a hex value.
cirra_palette:
  # surfaces, darkest to lightest
  crust:     "101119"
  mantle:    "161722"
  base:      "1B1D2B"
  surface0:  "252840"
  surface1:  "313552"
  surface2:  "3D4163"
  overlay:   "575C7E"

  # text
  text:      "CDD6F4"
  subtext:   "A7B0CE"
  muted:     "8891A8"
  disabled:  "575C7E"

  # accents
  haze:      "C7B8E8"   # primary
  cirrus:    "B4CDE6"   # secondary
  blush:     "F0B8CC"
  verdigris: "A8D8CC"
  sage:      "9FD8B4"
  sun:       "F5D7A3"
  ember:     "F0C4A8"
  rose:      "EFA6A6"

# Semantic roles. Applications consume these names, not the raw colors, so
# reassigning a role is a one-line change.
cirra_roles:
  primary:   haze
  secondary: cirrus
  info:      cirrus
  success:   sage
  warning:   sun
  error:     rose
  notify:    blush
  bg:        base
  bg_alt:    mantle
  panel:     surface0
  border:    surface2
  fg:        text
  fg_dim:    subtext
  fg_muted:  muted

cirra_theme_targets:
  - { src: "colors-sh.j2",       dest: "~/.config/cirra/colors.sh" }
  - { src: "colors-css.j2",      dest: "~/.config/cirra/colors.css" }
  - { src: "colors-hypr.j2",     dest: "~/.config/hypr/conf.d/theme.conf" }
  - { src: "colors-kitty.j2",    dest: "~/.config/kitty/theme.conf" }
  - { src: "colors-waybar.j2",   dest: "~/.config/waybar/theme.css" }
