---
# The CachyOS installer writes the repo sections for the detected CPU tier and
# owns pacman.conf thereafter. Section names are generation-specific
# (cachyos-znver4, cachyos-core-znver4, cachyos-extra-znver4 on Zen 4+;
# cachyos-v3 on other v3-capable CPUs) and do not map cleanly from the
# x86-64-vN level, so this role reads the configuration rather than writing it.
# Appending sections here produces duplicate-repo warnings at best and broken
# Include paths at worst.
- name: Read configured CachyOS repos
  ansible.builtin.shell:
    cmd: |
      grep -oP '^\[\Kcachyos[^]]*' /etc/pacman.conf || true
  register: nyx_repos_found
  changed_when: false

- name: Require at least one CachyOS repo
  ansible.builtin.assert:
    that: nyx_repos_found.stdout_lines | length > 0
    fail_msg: >-
      No CachyOS repositories found in /etc/pacman.conf. Install from the
      CachyOS ISO with "CachyOS Packages" selected, or add cachyos-keyring
      and the mirrorlists before running this role.
    success_msg: "CachyOS repos present"

- name: Show detected microarch and active repos
  ansible.builtin.debug:
    msg: >-
      march={{ nyx_profile.march }}
      repos={{ nyx_repos_found.stdout_lines }}

- name: Protect branding files from package upgrades
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^NoUpgrade\s*='
    line: "NoUpgrade = etc/os-release usr/lib/os-release etc/lsb-release"
    insertafter: '^\[options\]'

- name: Base packages
  community.general.pacman:
    name: "{{ nyx_packages_base + [nyx_kernel, nyx_kernel_headers] }}"
    state: present
    update_cache: true

# The user is always created; only the password is conditional. Previously
# the whole task was skipped when no password was given, so a run without one
# produced a machine with no account at all.
- name: Does the primary user already exist?
  ansible.builtin.getent:
    database: passwd
    key: "{{ nyx_user }}"
    fail_key: false

- name: Primary user exists
  ansible.builtin.debug:
    msg: "{{ nyx_user }} already exists; its password is left alone."
  when: getent_passwd[nyx_user] is not none

# Asked here rather than by a vars_prompt in site.yml. A vars_prompt runs
# before any fact exists, so it cannot be conditional: it asked on every run
# and then announced that the answer was ignored. pause is an ordinary task
# and takes a when:, so the question is only put when the answer is used.
#
# This also closes a real gap on the install.sh path. That supplies
# nyx_password_hash, which does NOT suppress a vars_prompt — Ansible skips a
# prompt only when a variable of the SAME name is set — so the prompt was
# reached on every unattended install, read EOF from install.sh's </dev/null
# and returned empty. It worked by accident. Now the block is genuinely
# skipped, because the hash is present.
#
# echo: false keeps the typing off the screen. The registered value is not
# printed at default verbosity but would be at -v, so everything that reads
# it is no_log.
- name: Password for the new account
  when:
    - getent_passwd[nyx_user] is none
    - (nyx_password_hash | default('') | length == 0)
    - (nyx_password | default('') | length == 0)
  block:
    - name: Prompt for a password
      ansible.builtin.pause:
        prompt: "Password for {{ nyx_user }}"
        echo: false
      register: nyx_pw_first

    - name: Confirm the password
      ansible.builtin.pause:
        prompt: "Confirm"
        echo: false
      register: nyx_pw_second

    - name: The two entries must match
      ansible.builtin.assert:
        that:
          - nyx_pw_first.user_input | length > 0
          - nyx_pw_first.user_input == nyx_pw_second.user_input
        fail_msg: >-
          Empty or mismatched. {{ nyx_user }} has not been created and nothing
          else has been changed; run the playbook again.
        success_msg: "password accepted"
      no_log: true

# install.sh supplies nyx_password_hash, already hashed by openssl. A password
# typed at the prompt above, or given as -e nyx_password=, arrives as
# plaintext and is hashed here. Deliberately not hashed by a vars_prompt
# encrypt: — with that, a blank answer became the hash of the empty string
# rather than staying empty, which silently created an account with an empty
# password.
- name: Collect the supplied password
  ansible.builtin.set_fact:
    nyx_password_plain: >-
      {{ nyx_password if (nyx_password | default('') | length > 0)
         else (nyx_pw_first.user_input | default('')) }}
  no_log: true
  when: getent_passwd[nyx_user] is none

# Set only when there is actually a password. Storing Ansible's `omit`
# placeholder in a fact and reusing it later works by accident rather than by
# contract — it is a magic string substituted during task-argument
# resolution, not a value facts are meant to carry.
- name: Resolve the password hash
  ansible.builtin.set_fact:
    nyx_password_final: >-
      {{ nyx_password_hash if (nyx_password_hash | default('') | length > 0)
         else (nyx_password_plain | password_hash('sha512')) }}
  no_log: true
  when:
    - getent_passwd[nyx_user] is none
    - (nyx_password_hash | default('') | length > 0)
      or (nyx_password_plain | default('') | length > 0)

- name: A new account needs a password
  ansible.builtin.assert:
    that: nyx_password_final is defined
    fail_msg: >-
      {{ nyx_user }} does not exist and no password was given, so the account
      cannot be created. Answer the prompt, or pass
      -e nyx_password_hash='<sha512-crypt>'.
    success_msg: "creating {{ nyx_user }}"
  when: getent_passwd[nyx_user] is none

- name: Primary user
  ansible.builtin.user:
    name: "{{ nyx_user }}"
    groups: "{{ nyx_user_groups }}"
    append: true
    shell: "{{ nyx_shell }}"
    # omit when the account already exists, so nothing touches its password.
    password: "{{ nyx_password_final | default(omit) }}"
    # A freshly salted hash always differs from /etc/shadow, so without this
    # the task reports changed on every play.
    update_password: on_create
  no_log: true

# After the user exists, and before sshd is hardened below. On a VM that
# hardening turns off password auth, so a missing key here locks SSH out.
- name: Authorized SSH keys
  ansible.posix.authorized_key:
    user: "{{ nyx_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ nyx_ssh_authorized_keys }}"
  when: nyx_ssh_authorized_keys | length > 0

- name: Wheel sudo
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL:ALL) ALL\n"
    dest: /etc/sudoers.d/10-wheel
    mode: "0440"
    validate: "visudo -cf %s"

# --- AUR helper -----------------------------------------------------------
# makepkg cannot run as root, so the AUR module runs as nyx_user, which
# requires passwordless pacman for the duration. Granted here, revoked below.
# `command` is a shell builtin, so ansible.builtin.command cannot run it and
# would report rc!=0 unconditionally, re-running the bootstrap every play.
- name: Is the AUR helper already installed?
  ansible.builtin.shell:
    cmd: "command -v {{ nyx_aur_helper }}"
  register: nyx_have_helper
  changed_when: false
  failed_when: false

# Gate on what is MISSING, not on what is listed. nyx_packages_aur is
# non-empty whenever remote access is on (it carries hypr-rdp), so testing
# the list length made this true on every run: the block was entered only to
# write the temporary sudoers grant and delete it again, which reported two
# changed tasks on an otherwise converged machine and meant a second run
# could never come back clean.
#
# A name that pacman reports differently from the AUR package name reads as
# missing here, which re-enters the block and does exactly what it did
# before. Degrading to the old behaviour is the intended failure mode.
- name: Installed packages
  ansible.builtin.command: pacman -Qq
  register: nyx_pacman_installed
  changed_when: false

- name: Which AUR packages are missing?
  ansible.builtin.set_fact:
    nyx_aur_missing: >-
      {{ nyx_packages_aur | difference(nyx_pacman_installed.stdout_lines) }}

- name: Does this run need AUR work?
  ansible.builtin.set_fact:
    nyx_aur_needed: "{{ (nyx_have_helper.rc != 0)
                        or (nyx_aur_missing | length > 0) }}"

# The grant, everything done while it exists, and its revocation are one
# block so always: runs on every path. Previously these were sequential
# tasks: a failing makepkg or AUR build — which this repo deliberately keeps
# fatal — aborted the play and left the grant on disk permanently.
- name: AUR work
  when: nyx_aur_needed | bool
  block:
    - name: Temporary passwordless pacman for AUR builds
      ansible.builtin.copy:
        content: "{{ nyx_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
        dest: /etc/sudoers.d/99-nyx-aur-temp
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Bootstrap AUR helper
      when: nyx_have_helper.rc != 0
      become: true
      become_user: "{{ nyx_user }}"
      block:
        - name: Clone helper PKGBUILD
          ansible.builtin.git:
            repo: "https://aur.archlinux.org/{{ nyx_aur_helper }}-bin.git"
            dest: "/tmp/{{ nyx_aur_helper }}-bin"
            version: master
        - name: makepkg -si
          ansible.builtin.command: makepkg -si --noconfirm
          args:
            chdir: "/tmp/{{ nyx_aur_helper }}-bin"
          changed_when: true

    - name: AUR packages
      kewlfft.aur.aur:
        name: "{{ nyx_aur_missing }}"
        use: "{{ nyx_aur_helper }}"
        state: present
      become: true
      become_user: "{{ nyx_user }}"
      when: nyx_aur_missing | length > 0
  always:
    - name: Revoke temporary passwordless pacman
      ansible.builtin.file:
        path: /etc/sudoers.d/99-nyx-aur-temp
        state: absent

# --- services -------------------------------------------------------------
- name: NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    enabled: true
    state: started

# Refuse suspend outright on machines that must stay up. ii's hypridle has a
# 900s listener running `systemctl suspend`, and a Hyper-V guest loses eth0
# across that — hv_netvsc does not reinitialise, so NetworkManager reports the
# device unmanaged and the network is gone until it is told to take it back.
#
# Masked rather than configured away in hypridle.conf, which ./setup install
# rewrites every run. Screen blanking still works; only sleep is refused.
#
# Do not reduce nyx_sleep_targets to sleep.target alone. logind checks the
# load state of the action target before it emits PrepareForSleep(true), so
# masking suspend.target makes it refuse up front. Masking only sleep.target
# would let logind run the whole pre-sleep sequence — including the
# NetworkManager sleep handling that unmanages the interface — and fail at the
# final job, which is the bug rather than the fix. sleep.target is in the list
# for a separate reason: systemd-suspend.service has Requires=sleep.target, so
# masking it closes the `systemctl start systemd-suspend.service` path.
- name: Refuse suspend
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: "{{ nyx_inhibit_sleep | bool }}"
  loop: "{{ nyx_sleep_targets }}"

# VMs get sshd so the dev loop works. Physical machines do not, unless
# something asks for it — remote access needs it, and wayvnc is reached
# through an SSH tunnel rather than by exposing VNC.
- name: sshd
  ansible.builtin.systemd_service:
    name: sshd
    enabled: "{{ nyx_sshd_enabled | bool }}"
    state: "{{ 'started' if nyx_sshd_enabled | bool else 'stopped' }}"

- name: Harden sshd
  ansible.builtin.copy:
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    dest: /etc/ssh/sshd_config.d/10-nyxos.conf
    mode: "0644"
  when: nyx_sshd_enabled | bool
  notify: restart sshd
