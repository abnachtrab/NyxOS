---
# The CachyOS installer writes the repo sections for the detected CPU tier and
# owns pacman.conf thereafter. Section names are generation-specific
# (cachyos-znver4, cachyos-core-znver4, cachyos-extra-znver4 on Zen 4+;
# cachyos-v3 on other v3-capable CPUs) and do not map cleanly from the
# x86-64-vN level, so this role reads the configuration rather than writing it.
# Appending sections here produces duplicate-repo warnings at best and broken
# Include paths at worst.
- name: Read configured CachyOS repos
  ansible.builtin.shell:
    cmd: |
      grep -oP '^\[\Kcachyos[^]]*' /etc/pacman.conf || true
  register: nyx_repos_found
  changed_when: false

- name: Require at least one CachyOS repo
  ansible.builtin.assert:
    that: nyx_repos_found.stdout_lines | length > 0
    fail_msg: >-
      No CachyOS repositories found in /etc/pacman.conf. Install from the
      CachyOS ISO with "CachyOS Packages" selected, or add cachyos-keyring
      and the mirrorlists before running this role.
    success_msg: "CachyOS repos present"

- name: Show detected microarch and active repos
  ansible.builtin.debug:
    msg: >-
      march={{ nyx_profile.march }}
      repos={{ nyx_repos_found.stdout_lines }}

- name: Protect branding files from package upgrades
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^NoUpgrade\s*='
    line: "NoUpgrade = etc/os-release usr/lib/os-release etc/lsb-release"
    insertafter: '^\[options\]'

- name: Base packages
  community.general.pacman:
    name: "{{ nyx_packages_base + [nyx_kernel, nyx_kernel_headers] }}"
    state: present
    update_cache: true

- name: Primary user
  ansible.builtin.user:
    name: "{{ nyx_user }}"
    groups: "{{ nyx_user_groups }}"
    append: true
    shell: "{{ nyx_shell }}"
    password: "{{ nyx_password }}"
    # vars_prompt salts freshly each run, so the hash always differs from
    # /etc/shadow. Without this the task reports changed on every play.
    update_password: on_create
  when: nyx_password | default('') | length > 0

# After the user exists, and before sshd is hardened below. On a VM that
# hardening turns off password auth, so a missing key here locks SSH out.
- name: Authorized SSH keys
  ansible.posix.authorized_key:
    user: "{{ nyx_user }}"
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ nyx_ssh_authorized_keys }}"
  when: nyx_ssh_authorized_keys | length > 0

- name: Wheel sudo
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL:ALL) ALL\n"
    dest: /etc/sudoers.d/10-wheel
    mode: "0440"
    validate: "visudo -cf %s"

# --- AUR helper -----------------------------------------------------------
# makepkg cannot run as root, so the AUR module runs as nyx_user, which
# requires passwordless pacman for the duration. Granted here, revoked below.
# `command` is a shell builtin, so ansible.builtin.command cannot run it and
# would report rc!=0 unconditionally, re-running the bootstrap every play.
- name: Is the AUR helper already installed?
  ansible.builtin.shell:
    cmd: "command -v {{ nyx_aur_helper }}"
  register: nyx_have_helper
  changed_when: false
  failed_when: false

- name: Does this run need AUR work?
  ansible.builtin.set_fact:
    nyx_aur_needed: "{{ (nyx_have_helper.rc != 0)
                        or (nyx_packages_aur | length > 0) }}"

# The grant, everything done while it exists, and its revocation are one
# block so always: runs on every path. Previously these were sequential
# tasks: a failing makepkg or AUR build — which this repo deliberately keeps
# fatal — aborted the play and left the grant on disk permanently.
- name: AUR work
  when: nyx_aur_needed | bool
  block:
    - name: Temporary passwordless pacman for AUR builds
      ansible.builtin.copy:
        content: "{{ nyx_user }} ALL=(ALL) NOPASSWD: /usr/bin/pacman\n"
        dest: /etc/sudoers.d/99-nyx-aur-temp
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Bootstrap AUR helper
      when: nyx_have_helper.rc != 0
      become: true
      become_user: "{{ nyx_user }}"
      block:
        - name: Clone helper PKGBUILD
          ansible.builtin.git:
            repo: "https://aur.archlinux.org/{{ nyx_aur_helper }}-bin.git"
            dest: "/tmp/{{ nyx_aur_helper }}-bin"
            version: master
        - name: makepkg -si
          ansible.builtin.command: makepkg -si --noconfirm
          args:
            chdir: "/tmp/{{ nyx_aur_helper }}-bin"
          changed_when: true

    - name: AUR packages
      kewlfft.aur.aur:
        name: "{{ nyx_packages_aur }}"
        use: "{{ nyx_aur_helper }}"
        state: present
      become: true
      become_user: "{{ nyx_user }}"
      when: nyx_packages_aur | length > 0
  always:
    - name: Revoke temporary passwordless pacman
      ansible.builtin.file:
        path: /etc/sudoers.d/99-nyx-aur-temp
        state: absent

# --- services -------------------------------------------------------------
- name: NetworkManager
  ansible.builtin.systemd_service:
    name: NetworkManager
    enabled: true
    state: started

# VMs get sshd so the dev loop works. Physical machines do not, unless
# something asks for it — remote access needs it, and wayvnc is reached
# through an SSH tunnel rather than by exposing VNC.
- name: sshd
  ansible.builtin.systemd_service:
    name: sshd
    enabled: "{{ nyx_sshd_enabled | bool }}"
    state: "{{ 'started' if nyx_sshd_enabled | bool else 'stopped' }}"

- name: Harden sshd
  ansible.builtin.copy:
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    dest: /etc/ssh/sshd_config.d/10-nyxos.conf
    mode: "0644"
  when: nyx_sshd_enabled | bool
  notify: restart sshd
