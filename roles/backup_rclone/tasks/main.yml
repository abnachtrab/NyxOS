---
# Packages only for now. The sync unit, timer and --backup-dir layout are
# Phase 8; see docs/ROADMAP.md.

- name: Backup packages
  community.general.pacman:
    name: "{{ nyx_backup_packages }}"
    state: present

- name: Remaining work
  ansible.builtin.debug:
    msg: >-
      rclone is installed but not configured. Run `rclone config` to create
      the {{ nyx_rclone_remote }} remote; the token is per-machine and is
      never committed. The systemd timer is Phase 8.
