---
nyx_hypr_packages_core:
  - hyprland
  - hyprpolkitagent
  - hyprlock
  - hypridle
  - hyprpaper
  - hyprcursor
  # Both portals are required. -hyprland handles screencopy and window
  # picking; -gtk handles file chooser, settings, and print. Installing only
  # one silently breaks whichever the other owns.
  - xdg-desktop-portal
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk

nyx_hypr_packages_shell:
  - waybar
  - fuzzel
  - swaync
  - cliphist
  - wl-clipboard
  - grim
  - slurp
  - wlogout

nyx_hypr_packages_support:
  - qt5-wayland
  - qt6-wayland
  - polkit
  - pipewire
  - wireplumber
  - xdg-user-dirs
  - playerctl
  - pamixer

# greetd is the login daemon, tuigreet the greeter. Both from the repos.
nyx_hypr_dm_packages:
  - greetd
  - greetd-tuigreet

nyx_hypr_terminal: kitty
nyx_hypr_filemanager: nautilus
nyx_hypr_modkey: SUPER

# Per-host monitor lines. Nothing generic is correct here, so the default is
# Hyprland's own autodetect. Override in host_vars.
nyx_hypr_monitors:
  - ",preferred,auto,1"

nyx_hypr_conf_parts:
  - monitors
  - env
  - autostart
  - keybinds
  - rules

# Empty renders a solid base colour. Point this at a real file once
# roles/branding ships one; a missing path makes hyprlock fail to draw a
# background rather than falling back.
nyx_hypr_wallpaper: ""
# Visual effects are NOT tied to is_vm. The VM is a design surface: blur and
# animations must render there or they cannot be tuned. Set false only if
# software rendering becomes too slow to work in.
nyx_hypr_effects: true

nyx_hypr_idle_lock_secs: 300
nyx_hypr_idle_dpms_secs: 600
