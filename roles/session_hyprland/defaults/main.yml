---
# illogical-impulse (end-4/dots-hyprland) provides the shell: bar,
# notifications, launcher overlay, OSD, session menu, and the Hyprland config
# set. It is Quickshell/QML underneath, and it themes with matugen — colours
# are derived from the wallpaper at runtime, not from a fixed palette.
# roles/theme was removed for that reason.
#
# Package installation is ii's own job. `./setup install` resolves the
# illogical-impulse-* meta-packages itself and is documented as idempotent, so
# this role does not carry a hand-transcribed package list — a package sorted
# into the wrong repo would fail the run, and the list changes upstream.

# --- upstream source ------------------------------------------------------
# This tracks a branch, so every run can pull a different desktop: the role
# re-runs ./setup install each play and ii moves fast. Pin to a tag or a
# commit once the current state is one worth keeping.
nyx_ii_repo: "https://github.com/end-4/dots-hyprland"
nyx_ii_version: "main"
# Upstream's default location. Matching it means the documented manual update
# (git stash, git pull, ./setup install) works without a path argument.
nyx_ii_checkout: "/home/{{ nyx_user }}/.cache/dots-hyprland"

# ./setup install prompts by default, which would hang a play with stdin
# closed. -f is upstream's "force mode without any confirm".
#
# The system upgrade is skipped here and done by Ansible instead — see
# nyx_ii_sysupgrade. Not to avoid upgrading: ii installs packages built
# against current libraries and Arch has no supported partial-upgrade state,
# so the upgrade has to happen. But `sudo pacman -Syu` inside the installer
# asks things no setup flag can reach, such as
# "Replace zlib with cachyos/zlib-ng-compat? [Y/n]", and a replacement
# prompt on a pty with no one typing is a stall.
#
# Nothing else is skipped except backup, which a fresh install has no use
# for.
# ii owns the shell: fish config and the starship prompt come from it, which
# is why there is no dotfiles role and no shell config in this repo.
# fontconfig and plasma-browser-integration are kept for fonts and browser
# media integration, so --core is not used.
nyx_ii_setup_args:
  - "-f"
  - "--skip-backup"
  # The greeting ends in a pause. -f is documented as covering confirms, but
  # the greeting is a separate flag and cheaper to pass than to test.
  - "--skip-allgreeting"
  - "--skip-sysupdate"

# Full -Syu before the installer runs, so its own skipped upgrade leaves
# nothing to do. Ansible's pacman module passes --noconfirm, which answers
# package-replacement questions instead of stalling on them. Set false only
# if something else has already upgraded the system this boot.
nyx_ii_sysupgrade: true

# Notification daemons claim org.freedesktop.Notifications on the session bus.
# Only one process can hold it, so anything left installed races Quickshell's
# implementation and the loser silently shows nothing.
nyx_ii_conflicting_daemons:
  - swaync
  - dunst
  - mako

# ii's packages are a pacman group. Without this an upgrade pulls them from
# the AUR-built versions and conflicts; upstream declines to edit pacman.conf
# automatically, but roles/base already manages NoUpgrade in the same file.
nyx_ii_ignore_group: true

# Ansible shows nothing until a command returns, so a working installer and
# a wedged one look identical — hence the log file and the timeout.
#
# The timeout is a spin detector, not a build budget. Observed installs
# finish in a couple of minutes on a fast link; the one run that hit 90
# minutes was sudo failing in a retry loop, not a slow build. Raise it only
# if a run is genuinely still working when it trips.
nyx_ii_setup_log: "/home/{{ nyx_user }}/.cache/nyx-ii-setup.log"
nyx_ii_setup_timeout: 1800

# pctrade/end4-pC, a Quickshell config that installs alongside ii rather than
# replacing it — it requires illogical-impulse installed and running, so it
# is fetched after the installer.
nyx_end4pc_enabled: true
nyx_end4pc_repo: "https://github.com/pctrade/end4-pC"
nyx_end4pc_version: "main"

# Which Quickshell config Hyprland launches. Upstream ships "ii".
nyx_qs_config: "end4-pC"

# Seed ~/.config/illogical-impulse/config.json from the committed template.
# Set false to let the shell generate its own defaults instead.
nyx_ii_shell_config: true

# Tweaks layered over ii's config after it is applied, so they win. Anything
# under files/ii-overlay/ is copied into ~/.config with the same tree shape.
nyx_ii_overlay: true

# matugen derives the whole scheme from this image, so unlike the old palette
# setup it is required rather than optional. An empty value leaves ii on its
# built-in default colours.
#
# Resolved by ansible.builtin.copy: a bare name comes from this role's
# files/, an absolute path from the control machine — which is the target
# too, since the playbook runs with -c local.
nyx_hypr_wallpaper: ""

# greetd is the login daemon, tuigreet the greeter. Both from the repos.
nyx_hypr_dm_packages:
  - greetd
  - greetd-tuigreet

# Chromium and Electron do not pick Wayland on their own.
# ELECTRON_OZONE_PLATFORM_HINT covers Electron 28 and newer; these files cover
# older builds and Chromium itself. Arch's launcher wrappers read
# ~/.config/<name>-flags.conf. VSCode is known not to honour its file.
nyx_hypr_ozone_flags:
  - "--enable-features=UseOzonePlatform"
  - "--ozone-platform=wayland"

nyx_hypr_flag_files:
  - electron

nyx_hypr_packages_apps:
  - spotify-launcher
  # extra/code is Code - OSS, the open-source build: Open VSX instead of the
  # Microsoft marketplace, and none of the proprietary add-ons. The
  # MS-branded build is visual-studio-code-bin in the AUR, which this repo
  # keeps empty on purpose.
  #
  # Wayland comes from ELECTRON_OZONE_PLATFORM_HINT in hypr/custom/env.lua.
  # A code-flags.conf would not help — VSCode is the documented exception
  # that ignores its flags file.
  - code
  - firefox
  # Video wallpapers. end4-pC scripts/colors/switchwall.sh plays mp4, webm,
  # mkv, avi and mov through mpvpaper and thumbnails them with ffmpeg. It is
  # an end4-pC feature: ii has no reference to it, and end4-pC is a cloned
  # config directory rather than a package, so it declares no dependencies of
  # its own and nothing else pulls this in.
  #
  # cachyos/mpvpaper, so a plain repo install — nyx_packages_aur stays empty.
  # ffmpeg arrives transitively as an mpv dependency.
  - mpvpaper

# ---------------------------------------------------------------------------
# Firefox enterprise policy
# ---------------------------------------------------------------------------
# Rendered to /etc/firefox/policies/policies.json. System-wide, applied
# before first launch, and not something the user has to re-click after a
# reinstall — which is the point of putting it here rather than in settings.
#
# Written as YAML so the reasoning can live in comments; the template is just
# a to_nice_json of this dict. Reference:
# https://mozilla.github.io/policy-templates/
#
# "Locked": true would grey the setting out in the UI. Deliberately not used:
# this is a personal machine, not a fleet, and a policy that cannot be
# overridden is an annoyance the first time it is wrong.
nyx_firefox_policies:
  policies:

    # --- data collection ---------------------------------------------------
    DisableTelemetry: true
    # Studies is the Shield mechanism that ships experiments to subsets of
    # users without asking. It is how PPA arrived enabled.
    DisableFirefoxStudies: true
    # An object with an Enabled key, not a bare boolean.
    CrashReportsSubmit:
      Enabled: false
    # "Report broken site" menus, which send the URL to Mozilla.
    DisableFeedbackCommands: true
    # Firefox 148+. Left ON: the same channel that delivers remote config
    # also delivers stability and performance fixes between releases, and
    # losing those costs more than the callbacks are worth.
    DisableRemoteImprovements: false

    # --- advertising and messaging -----------------------------------------
    # Highlights is the "Recent activity" row: kept.
    # Stories/SponsoredStories replaced Pocket/SponsoredPocket in Firefox
    # 141; both pairs are set so this works either side of that.
    # Weather is a new-tab widget added in 152 that fetches by location.
    # Snippets is NOT set: deprecated in Firefox 122, the feature is gone.
    FirefoxHome:
      Search: true
      TopSites: true
      SponsoredTopSites: false
      Highlights: true
      Weather: true
      Pocket: false
      SponsoredPocket: false
      Stories: false
      SponsoredStories: false

    # ImproveSuggest is the telemetry feeding suggestion ranking.
    FirefoxSuggest:
      WebSuggestions: true
      SponsoredSuggestions: false
      ImproveSuggest: false

    # FirefoxLabs true shows the about:preferences#experimental panel.
    # WhatsNew is NOT set: deprecated.
    UserMessaging:
      ExtensionRecommendations: false
      FeatureRecommendations: false
      UrlbarInterventions: false
      SkipOnboarding: true
      MoreFromMozilla: false
      FirefoxLabs: true
      Locked: true

    SkipTermsOfUse: true

    # --- AI ----------------------------------------------------------------
    # An object, not a boolean. Chatbot covers the sidebar assistant, so the
    # separate AIChatbot policy is unnecessary — that one configures chatbot
    # providers rather than switching the feature on or off.
    GenerativeAI:
      Enabled: false
      Chatbot: false
      LinkPreviews: false
      TabGroups: false
      SmartWindow: false

    # Independent of GenerativeAI, confirmed. Google Lens in the context
    # menu, and it only works while Google is the default engine — which it
    # is, below.
    VisualSearchEnabled: true

    # --- tracking ----------------------------------------------------------
    # Fingerprinting blocks known fingerprinters and breaks very little.
    # SuspectedFingerprinting (142+) is the broader baseline protection and
    # is the one to drop first if a site misbehaves.
    # Category is deliberately unset: it would override everything here
    # except the three exception keys.
    EnableTrackingProtection:
      Value: true
      Cryptomining: true
      Fingerprinting: true
      EmailTracking: true
      SuspectedFingerprinting: true
      Exceptions: []

    # partition-foreign is the Firefox 153 name for what used to be
    # reject-tracker-and-partition-foreign, which is deprecated. Blocks known
    # trackers and partitions all other third-party cookies per-site.
    # reject-foreign would block third-party cookies outright and break SSO.
    Cookies:
      Behavior: "partition-foreign"
      BehaviorPrivateBrowsing: "partition-foreign"

    LocalNetworkAccess:
      Enabled: true
      BlockTrackers: true
      EnablePrompting: true

    # DoH off. Enabled false sets network.trr.mode=5, which also stops
    # Firefox's own automatic rollout, so DNS keeps reaching the Pi-hole.
    # Locked is omitted, so it can still be turned on by hand later.
    DNSOverHTTPS:
      Enabled: false

    # "enabled" is on-by-default with a per-site escape to HTTP.
    # force_enabled would remove the escape.
    HttpsOnlyMode: "enabled"

    IPProtectionAvailable: false

    # Prefetch and preconnect. More requests at the Pi-hole, faster loads.
    NetworkPrediction: true

    # --- accounts and passwords --------------------------------------------
    DisableFirefoxAccounts: true
    PasswordManagerEnabled: false
    DisableFormHistory: true

    # --- annoyances --------------------------------------------------------
    NoDefaultBookmarks: true
    DisableSetDesktopBackground: true
    DisableProfileRefresh: true

    # --- permissions -------------------------------------------------------
    # 3 = allowed, 2 = blocked. There is no "ask" value. Setting any policy
    # at all blocks WebSerial by default, so this has to be stated.
    DefaultSerialGuardSetting: 3

    # Default true means popups are ALLOWED, so blocking is false.
    # Locked false keeps per-site exceptions available.
    PopupBlocking:
      Default: false
      Locked: false

    # --- containers --------------------------------------------------------
    # The built-in Containers policy is NOT set: Multi-Account Containers
    # below manages them instead. Both prefs are individually allowlisted,
    # and the extension needs the underlying feature switched on.
    #
    # Note the two are complementary rather than alternatives — the extension
    # is a management UI over the same contextual identities the policy would
    # pre-create. Restoring the policy would seed Personal and Work with set
    # icons and colours instead of taking the extension's defaults.

    # --- extensions --------------------------------------------------------
    # Every slug confirmed against addons.mozilla.org. A bad URL fails
    # silently, so check about:policies after first launch.
    Extensions:
      Install:
        - "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
        - "https://addons.mozilla.org/firefox/downloads/latest/wayback-machine_new/latest.xpi"
        - "https://addons.mozilla.org/firefox/downloads/latest/multi-account-containers/latest.xpi"
        - "https://addons.mozilla.org/firefox/downloads/latest/enhancer-for-youtube/latest.xpi"
        - "https://addons.mozilla.org/firefox/downloads/latest/dashlane/latest.xpi"

    # --- search ------------------------------------------------------------
    # Remove matches each engine's display name. Mozilla does not publish the
    # built-in set, so this list was read off about:preferences#search on a
    # real install rather than guessed: Amazon.com and eBay are no longer
    # shipped, and Perplexity now is.
    #
    # A Remove entry that matches nothing is silently ignored — it is not a
    # policy error, so about:policies will not flag a stale name here. If the
    # set changes again, re-read it from that page.
    SearchEngines:
      Default: "Google"
      Remove:
        - "Bing"
        - "DuckDuckGo"
        - "Perplexity"
        - "Wikipedia (en)"

    # --- prefs -------------------------------------------------------------
    # dom. and browser. are allowed prefixes. privacy.* is not blanket
    # allowed, but these three are individually permitted.
    Preferences:
      "dom.private-attribution.submission.enabled":
        Value: false
        Status: "default"
        Type: "boolean"
      "privacy.globalprivacycontrol.enabled":
        Value: true
        Status: "default"
        Type: "boolean"
      # Containers themselves, and the container UI Multi-Account Containers
      # builds on.
      "privacy.userContext.enabled":
        Value: true
        Status: "default"
        Type: "boolean"
      "privacy.userContext.ui.enabled":
        Value: true
        Status: "default"
        Type: "boolean"
