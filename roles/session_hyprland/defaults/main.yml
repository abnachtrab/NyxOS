---
# illogical-impulse (end-4/dots-hyprland) provides the shell: bar,
# notifications, launcher overlay, OSD, session menu, and the Hyprland config
# set. It is Quickshell/QML underneath, and it themes with matugen — colours
# are derived from the wallpaper at runtime, not from a fixed palette.
# roles/theme was removed for that reason.
#
# Package installation is ii's own job. `./setup install` resolves the
# illogical-impulse-* meta-packages itself and is documented as idempotent, so
# this role does not carry a hand-transcribed package list — a package sorted
# into the wrong repo would fail the run, and the list changes upstream.

# --- upstream source ------------------------------------------------------
# Pinned to a tag or commit rather than a branch: ii moves fast, and an
# unpinned clone means the desktop changes under you on any re-run.
nyx_ii_repo: "https://github.com/end-4/dots-hyprland"
nyx_ii_version: "main"
# Upstream's default location. Matching it means the documented manual update
# (git stash, git pull, ./setup install) works without a path argument.
nyx_ii_checkout: "/home/{{ nyx_user }}/.cache/dots-hyprland"

# ./setup install prompts by default, which would hang a play with stdin
# closed. -f is upstream's "force mode without any confirm".
#
# A full pacman -Syu is deliberately NOT skipped: ii installs packages built
# against current libraries, and Arch has no supported partial-upgrade state.
#
# --skip-fish skips ii's fish *config*, not the package — fish is a
# dependency of illogical-impulse-fonts-themes and still gets installed.
# nyx_shell stays zsh, and ii's zsh colourscheme drop-in is sourced from
# .zshrc further down this role.
#
# Kept deliberately: fontconfig and plasma-browser-integration (fonts and
# browser media integration), quickshell, the Hyprland config and its
# session entry. --core would have dropped the first two, so it is not used.
nyx_ii_setup_args:
  - "-f"
  - "--skip-fish"
  - "--skip-backup"

# Notification daemons claim org.freedesktop.Notifications on the session bus.
# Only one process can hold it, so anything left installed races Quickshell's
# implementation and the loser silently shows nothing.
nyx_ii_conflicting_daemons:
  - swaync
  - dunst
  - mako

# ii's packages are a pacman group. Without this an upgrade pulls them from
# the AUR-built versions and conflicts; upstream declines to edit pacman.conf
# automatically, but roles/base already manages NoUpgrade in the same file.
nyx_ii_ignore_group: true

# Tweaks layered over ii's config after it is applied, so they win. Anything
# under files/ii-overlay/ is copied into ~/.config with the same tree shape.
nyx_ii_overlay: true

# matugen derives the whole scheme from this image, so unlike the old palette
# setup it is required rather than optional. An empty value leaves ii on its
# built-in default colours.
nyx_hypr_wallpaper: ""

# greetd is the login daemon, tuigreet the greeter. Both from the repos.
nyx_hypr_dm_packages:
  - greetd
  - greetd-tuigreet

# Chromium and Electron do not pick Wayland on their own.
# ELECTRON_OZONE_PLATFORM_HINT covers Electron 28 and newer; these files cover
# older builds and Chromium itself. Arch's launcher wrappers read
# ~/.config/<name>-flags.conf. VSCode is known not to honour its file.
nyx_hypr_ozone_flags:
  - "--enable-features=UseOzonePlatform"
  - "--ozone-platform=wayland"

nyx_hypr_flag_files:
  - electron

nyx_hypr_packages_apps:
  - spotify-launcher
