---
# illogical-impulse (end-4/dots-hyprland) provides the shell: bar,
# notifications, launcher overlay, OSD, session menu, and the Hyprland config
# set. It is Quickshell/QML underneath, and it themes with matugen — colours
# are derived from the wallpaper at runtime, not from a fixed palette.
# roles/theme was removed for that reason.
#
# Package installation is ii's own job. `./setup install` resolves the
# illogical-impulse-* meta-packages itself and is documented as idempotent, so
# this role does not carry a hand-transcribed package list — a package sorted
# into the wrong repo would fail the run, and the list changes upstream.

# --- upstream source ------------------------------------------------------
# This tracks a branch, so every run can pull a different desktop: the role
# re-runs ./setup install each play and ii moves fast. Pin to a tag or a
# commit once the current state is one worth keeping.
nyx_ii_repo: "https://github.com/end-4/dots-hyprland"
nyx_ii_version: "main"
# Upstream's default location. Matching it means the documented manual update
# (git stash, git pull, ./setup install) works without a path argument.
nyx_ii_checkout: "/home/{{ nyx_user }}/.cache/dots-hyprland"

# ./setup install prompts by default, which would hang a play with stdin
# closed. -f is upstream's "force mode without any confirm".
#
# The system upgrade is skipped here and done by Ansible instead — see
# nyx_ii_sysupgrade. Not to avoid upgrading: ii installs packages built
# against current libraries and Arch has no supported partial-upgrade state,
# so the upgrade has to happen. But `sudo pacman -Syu` inside the installer
# asks things no setup flag can reach, such as
# "Replace zlib with cachyos/zlib-ng-compat? [Y/n]", and a replacement
# prompt on a pty with no one typing is a stall.
#
# Nothing else is skipped except backup, which a fresh install has no use
# for.
# ii owns the shell: fish config and the starship prompt come from it, which
# is why there is no dotfiles role and no shell config in this repo.
# fontconfig and plasma-browser-integration are kept for fonts and browser
# media integration, so --core is not used.
nyx_ii_setup_args:
  - "-f"
  - "--skip-backup"
  # The greeting ends in a pause. -f is documented as covering confirms, but
  # the greeting is a separate flag and cheaper to pass than to test.
  - "--skip-allgreeting"
  - "--skip-sysupdate"

# Full -Syu before the installer runs, so its own skipped upgrade leaves
# nothing to do. Ansible's pacman module passes --noconfirm, which answers
# package-replacement questions instead of stalling on them. Set false only
# if something else has already upgraded the system this boot.
nyx_ii_sysupgrade: true

# Notification daemons claim org.freedesktop.Notifications on the session bus.
# Only one process can hold it, so anything left installed races Quickshell's
# implementation and the loser silently shows nothing.
nyx_ii_conflicting_daemons:
  - swaync
  - dunst
  - mako

# ii's packages are a pacman group. Without this an upgrade pulls them from
# the AUR-built versions and conflicts; upstream declines to edit pacman.conf
# automatically, but roles/base already manages NoUpgrade in the same file.
nyx_ii_ignore_group: true

# Ansible shows nothing until a command returns, so a working installer and
# a wedged one look identical — hence the log file and the timeout.
#
# The timeout is a spin detector, not a build budget. Observed installs
# finish in a couple of minutes on a fast link; the one run that hit 90
# minutes was sudo failing in a retry loop, not a slow build. Raise it only
# if a run is genuinely still working when it trips.
nyx_ii_setup_log: "/home/{{ nyx_user }}/.cache/nyx-ii-setup.log"
nyx_ii_setup_timeout: 1800

# Tweaks layered over ii's config after it is applied, so they win. Anything
# under files/ii-overlay/ is copied into ~/.config with the same tree shape.
nyx_ii_overlay: true

# matugen derives the whole scheme from this image, so unlike the old palette
# setup it is required rather than optional. An empty value leaves ii on its
# built-in default colours.
#
# Resolved by ansible.builtin.copy: a bare name comes from this role's
# files/, an absolute path from the control machine — which is the target
# too, since the playbook runs with -c local.
nyx_hypr_wallpaper: ""

# greetd is the login daemon, tuigreet the greeter. Both from the repos.
nyx_hypr_dm_packages:
  - greetd
  - greetd-tuigreet

# Chromium and Electron do not pick Wayland on their own.
# ELECTRON_OZONE_PLATFORM_HINT covers Electron 28 and newer; these files cover
# older builds and Chromium itself. Arch's launcher wrappers read
# ~/.config/<name>-flags.conf. VSCode is known not to honour its file.
nyx_hypr_ozone_flags:
  - "--enable-features=UseOzonePlatform"
  - "--ozone-platform=wayland"

nyx_hypr_flag_files:
  - electron

nyx_hypr_packages_apps:
  - spotify-launcher
  # extra/code is Code - OSS, the open-source build: Open VSX instead of the
  # Microsoft marketplace, and none of the proprietary add-ons. The
  # MS-branded build is visual-studio-code-bin in the AUR, which this repo
  # keeps empty on purpose.
  #
  # Wayland comes from ELECTRON_OZONE_PLATFORM_HINT in hypr/custom/env.lua.
  # A code-flags.conf would not help — VSCode is the documented exception
  # that ignores its flags file.
  - code
