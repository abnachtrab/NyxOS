---
# Installs illogical-impulse and layers NyxOS tweaks over it. ii owns the
# Hyprland config set, the Quickshell shell, and — through matugen — the
# colour scheme. This role owns package selection, the checkout, the overlay,
# and login.

- name: Login packages
  community.general.pacman:
    name: "{{ nyx_hypr_dm_packages + nyx_hypr_packages_apps }}"
    state: present

# Only one process can own org.freedesktop.Notifications. Anything left
# installed races Quickshell's implementation and the loser shows nothing,
# with no error anywhere.
- name: Remove conflicting notification daemons
  community.general.pacman:
    name: "{{ nyx_ii_conflicting_daemons }}"
    state: absent

# Upstream declines to edit pacman.conf automatically, calling it risky.
# roles/base already manages NoUpgrade in this file, so the precedent exists.
- name: Skip the illogical-impulse group on upgrade
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^IgnoreGroup\s*='
    line: "IgnoreGroup = illogical-impulse"
    insertafter: '^\[options\]'
  when: nyx_ii_ignore_group | bool

# --- illogical-impulse ----------------------------------------------------
- name: Fetch illogical-impulse
  ansible.builtin.git:
    repo: "{{ nyx_ii_repo }}"
    dest: "{{ nyx_ii_checkout }}"
    version: "{{ nyx_ii_version }}"
  become: true
  become_user: "{{ nyx_user }}"
  register: nyx_ii_clone

# ./setup install calls sudo_init_keepalive and needs more than pacman: it
# also sets up permissions and services. Wider than the makepkg grant in
# roles/base for that reason, and revoked in the always: block whether the
# installer succeeds or not.
- name: Temporary passwordless sudo for the ii installer
  ansible.builtin.copy:
    content: "{{ nyx_user }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/99-nyx-ii-temp
    mode: "0440"
    validate: "visudo -cf %s"

- name: Run the ii installer
  block:
    # Installs the illogical-impulse-* meta-packages and copies the config
    # tree. Prompts without -f, and with stdin closed that is a hang rather
    # than a failure — see nyx_ii_setup_args.
    #
    # changed_when tracks the checkout moving, which is an approximation:
    # the installer can do work when upstream has not changed, and this
    # reports ok in that case.
    - name: setup install
      ansible.builtin.command:
        argv: "{{ ['./setup', 'install'] + nyx_ii_setup_args }}"
        chdir: "{{ nyx_ii_checkout }}"
      become: true
      become_user: "{{ nyx_user }}"
      register: nyx_ii_setup
      changed_when: nyx_ii_clone.changed
  always:
    - name: Revoke temporary passwordless sudo
      ansible.builtin.file:
        path: /etc/sudoers.d/99-nyx-ii-temp
        state: absent

# --- NyxOS tweaks ---------------------------------------------------------
# Copied after ii, so anything here wins. Mirror the ~/.config tree shape
# under files/ii-overlay/ — e.g. files/ii-overlay/hypr/custom/keybinds.conf.
- name: NyxOS overlay
  ansible.builtin.copy:
    src: ii-overlay/
    dest: "/home/{{ nyx_user }}/.config/"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
    directory_mode: "0755"
  when: nyx_ii_overlay | bool

# ii's config is Lua: hyprland.lua loads internal libraries, then its own
# environment and defaults, then anything in custom/. Landing here means the
# NyxOS values are applied last. The name is fixed by upstream — env.lua, not
# env.conf; a hyprlang file here is silently never read.
- name: Hyprland custom directory
  ansible.builtin.file:
    path: "/home/{{ nyx_user }}/.config/hypr/custom"
    state: directory
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0755"

- name: NyxOS environment
  ansible.builtin.template:
    src: env.lua.j2
    dest: "/home/{{ nyx_user }}/.config/hypr/custom/env.lua"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"

# --- wallpaper ------------------------------------------------------------
# matugen derives the entire scheme from this image. Without it ii falls back
# to its built-in colours, so this is now load-bearing rather than cosmetic.
- name: Wallpaper
  ansible.builtin.copy:
    src: "{{ nyx_hypr_wallpaper }}"
    dest: "/home/{{ nyx_user }}/.config/background"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  when: nyx_hypr_wallpaper | length > 0

- name: Warn when no wallpaper is set
  ansible.builtin.debug:
    msg: >-
      nyx_hypr_wallpaper is empty, so matugen has nothing to derive a scheme
      from and ii keeps its built-in colours. Set it to a real image.
  when: nyx_hypr_wallpaper | length == 0

# --- application config ---------------------------------------------------
- name: Ozone flag files
  ansible.builtin.template:
    src: flags.conf.j2
    dest: "/home/{{ nyx_user }}/.config/{{ item }}-flags.conf"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  loop: "{{ nyx_hypr_flag_files }}"

- name: Spotify on Wayland
  ansible.builtin.copy:
    src: spotify-launcher.conf
    dest: "/home/{{ nyx_user }}/.config/spotify-launcher.conf"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  when: "'spotify-launcher' in nyx_hypr_packages_apps"

# Without an explicit preference the portal backend is chosen by whichever
# .portal file sorts first, which breaks screenshare non-deterministically.
# ii installs the KDE portal alongside the Hyprland and GTK ones, so this
# matters more here than it did before.
- name: Portal backend preference
  ansible.builtin.file:
    path: "/home/{{ nyx_user }}/.config/xdg-desktop-portal"
    state: directory
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0755"

- name: Portal backend config
  ansible.builtin.template:
    src: hyprland-portals.conf.j2
    dest: "/home/{{ nyx_user }}/.config/xdg-desktop-portal/hyprland-portals.conf"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"

- name: Session desktop entry
  ansible.builtin.copy:
    src: hyprland.desktop
    dest: /usr/share/wayland-sessions/hyprland.desktop
    mode: "0644"

# --- login ----------------------------------------------------------------
- name: greetd directory
  ansible.builtin.file:
    path: /etc/greetd
    state: directory
    mode: "0755"

- name: greetd config
  ansible.builtin.template:
    src: greetd.toml.j2
    dest: /etc/greetd/config.toml
    mode: "0644"
  notify: restart greetd

- name: Enable greetd
  ansible.builtin.systemd_service:
    name: greetd
    enabled: true
