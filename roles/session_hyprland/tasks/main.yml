---
# Installs illogical-impulse and layers NyxOS tweaks over it. ii owns the
# Hyprland config set, the Quickshell shell, and — through matugen — the
# colour scheme. This role owns package selection, the checkout, the overlay,
# and login.

# Upstream declines to edit pacman.conf automatically, calling it risky.
# roles/base already manages NoUpgrade in this file, so the precedent exists.
# Set before the upgrade so a re-run does not pull ii's packages from under
# the installer.
- name: Skip the illogical-impulse group on upgrade
  ansible.builtin.lineinfile:
    path: /etc/pacman.conf
    regexp: '^IgnoreGroup\s*='
    line: "IgnoreGroup = illogical-impulse"
    insertafter: '^\[options\]'
  when: nyx_ii_ignore_group | bool

# First, so everything installed below lands on an upgraded system. Arch has
# no supported partial-upgrade state, and ii installs packages built against
# current libraries.
#
# Done here rather than by the installer's own `sudo pacman -Syu`, which
# prompts for package replacements — "Replace zlib with
# cachyos/zlib-ng-compat? [Y/n]" — and no setup flag reaches that. The
# module passes --noconfirm, which answers them.
- name: System upgrade
  community.general.pacman:
    update_cache: true
    upgrade: true
  when: nyx_ii_sysupgrade | bool

- name: Login packages
  community.general.pacman:
    name: "{{ nyx_hypr_dm_packages + nyx_hypr_packages_apps }}"
    state: present

# Steam and the lib32-* halves of gamemode and mangohud need [multilib].
# roles/gpu asserts it too, but only when an NVIDIA card is present — this
# applies to every machine that wants games. Asserted rather than enabled,
# for the same reason roles/base reads the CachyOS sections instead of
# writing them.
- name: Read configured repos
  ansible.builtin.shell:
    cmd: |
      grep -oP '^\[\K[^]]+' /etc/pacman.conf || true
  register: nyx_hypr_repos
  changed_when: false
  when: nyx_hypr_packages_gaming | length > 0

- name: Require multilib for the 32-bit gaming libraries
  ansible.builtin.assert:
    that: "'multilib' in nyx_hypr_repos.stdout_lines"
    fail_msg: >-
      nyx_hypr_packages_gaming needs [multilib] in /etc/pacman.conf for steam
      and the lib32-* packages. Enable it, or empty the list.
    success_msg: "multilib present"
  when: nyx_hypr_repos.skipped is not defined

- name: Gaming packages
  community.general.pacman:
    name: "{{ nyx_hypr_packages_gaming }}"
    state: present
  when: nyx_hypr_packages_gaming | length > 0

# Only one process can own org.freedesktop.Notifications. Anything left
# installed races Quickshell's implementation and the loser shows nothing,
# with no error anywhere.
- name: Remove conflicting notification daemons
  community.general.pacman:
    name: "{{ nyx_ii_conflicting_daemons }}"
    state: absent

# --- illogical-impulse ----------------------------------------------------
- name: Fetch illogical-impulse
  ansible.builtin.git:
    repo: "{{ nyx_ii_repo }}"
    dest: "{{ nyx_ii_checkout }}"
    version: "{{ nyx_ii_version }}"
  become: true
  become_user: "{{ nyx_user }}"
  register: nyx_ii_clone

# ./setup install calls sudo_init_keepalive and runs makepkg, which shells
# out to `sudo pacman -U`. Wider than the makepkg grant in roles/base for
# that reason, and revoked in the always: block whether the installer
# succeeds or not.
#
# Two belts:
#
# `Defaults:<user> !authenticate` is a per-user default, not a command rule,
# so it is not subject to the last-matching-Cmnd_Spec-wins resolution that
# lets a %wheel rule elsewhere override a NOPASSWD line here.
#
# zz- so it sorts after everything in sudoers.d. 99- lost to something on a
# real run: sudo kept prompting with the grant in place. Files containing a
# dot or ending in ~ are ignored entirely, so the name matters.
# Everything that can fail while the grant exists lives INSIDE this block, so
# always: revokes it on every path. The grant and the check used to sit
# outside it: a failing check aborted the play and left unauthenticated root
# for nyx_user on disk permanently, which is the opposite of what the check
# was added to prevent.
- name: Run the ii installer
  block:
    - name: Temporary passwordless sudo for the ii installer
      ansible.builtin.copy:
        content: |
          Defaults:{{ nyx_user }} !authenticate
          {{ nyx_user }} ALL=(ALL) NOPASSWD: ALL
        dest: /etc/sudoers.d/zz-nyx-ii-temp
        mode: "0440"
        validate: "visudo -cf %s"

    # Fail here, with the reason, rather than 40 minutes later at an invisible
    # password prompt inside the installer.
    - name: Confirm the grant actually applies
      ansible.builtin.command:
        argv: ["sudo", "-n", "true"]
      become: true
      become_user: "{{ nyx_user }}"
      register: nyx_ii_sudo_check
      changed_when: false
      failed_when: nyx_ii_sudo_check.rc != 0

    # Installs the illogical-impulse-* meta-packages and copies the config
    # tree. Long: a full pacman -Syu, then Quickshell built against Qt6.
    #
    # `script` allocates a pty. Without one, the installer's sudo calls fail
    # with "a terminal is required to read the password" and it retries in a
    # loop until the async timeout — 90 minutes of nothing, which is how this
    # presented the first time.
    #
    # stdin stays /dev/null so a prompt that does appear reads EOF and fails
    # rather than waiting on a pty nobody is typing into. async is the
    # backstop if it wedges anyway.
    #
    # Output goes to a file because Ansible buffers a command's output until
    # it returns; tail that log to see whether it is working or stuck.
    #
    # changed_when tracks the checkout moving, which is an approximation:
    # the installer can do work when upstream has not changed, and this
    # reports ok in that case.
    - name: setup install
      ansible.builtin.shell:
        cmd: >-
          script -qec './setup install {{ nyx_ii_setup_args | join(' ') }}'
          /dev/null < /dev/null >> {{ nyx_ii_setup_log }} 2>&1
        chdir: "{{ nyx_ii_checkout }}"
      become: true
      become_user: "{{ nyx_user }}"
      register: nyx_ii_setup
      async: "{{ nyx_ii_setup_timeout }}"
      poll: 15
      changed_when: nyx_ii_clone.changed

    - name: Where to watch it
      ansible.builtin.debug:
        msg: "tail -f {{ nyx_ii_setup_log }}"
      when: nyx_ii_setup is not defined or nyx_ii_setup.rc | default(0) != 0
  always:
    - name: Revoke temporary passwordless sudo
      ansible.builtin.file:
        path: /etc/sudoers.d/zz-nyx-ii-temp
        state: absent

# --- end4-pC --------------------------------------------------------------
# A Quickshell config that lives alongside ii's rather than replacing it —
# it needs illogical-impulse installed and running, so this must come after
# the installer block above.
- name: Fetch end4-pC
  ansible.builtin.git:
    repo: "{{ nyx_end4pc_repo }}"
    dest: "/home/{{ nyx_user }}/.config/quickshell/end4-pC"
    version: "{{ nyx_end4pc_version }}"
  become: true
  become_user: "{{ nyx_user }}"
  when: nyx_end4pc_enabled | bool

# Upstream documents editing hypr/hyprland/variables.lua by hand. That file
# is ii's and ./setup install rsyncs over it, so the edit would not survive a
# re-run — it is reapplied here instead, after the installer, every play.
#
# custom/env.lua would be the tidier home for this, but qsConfig is read when
# the shell is launched and custom/ loads late; patching the file ii actually
# reads is the version that is known to work.
- name: Select the Quickshell config Hyprland launches
  ansible.builtin.lineinfile:
    path: "/home/{{ nyx_user }}/.config/hypr/hyprland/variables.lua"
    regexp: '^\s*hl\.env\("qsConfig"'
    line: 'hl.env("qsConfig", "{{ nyx_qs_config }}")'
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"

# Binds and general settings. custom/general.lua is one of the files ii
# documents as loaded from custom/, unlike an arbitrary filename there.
- name: NyxOS Hyprland general
  ansible.builtin.template:
    src: general.lua.j2
    dest: "/home/{{ nyx_user }}/.config/hypr/custom/general.lua"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"

# Shell settings, as configured through end4-pC own settings panel and then
# copied back out. end4-pC inherits ii settings path rather than using its
# own, so this file is shared between the two shells.
#
# A template rather than a flat overlay file because it carries absolute
# paths under the home directory, which have to follow nyx_user. render-check
# validates the rendered JSON, which is worth having for a 23KB file that is
# edited by a GUI rather than by hand.
#
# The application rewrites this at runtime, so the committed copy is a seed,
# not a source of truth. It drifts silently as soon as the panel is touched —
# re-copy it whenever the running state is worth keeping.
# Picker start directories, referenced by wallpaperSelector.userPath and
# liveWallpapersPath in config.json. Created so the pickers open somewhere
# real on a fresh install; the images themselves are not deployed.
- name: Wallpaper directories
  ansible.builtin.file:
    path: "/home/{{ nyx_user }}/{{ item }}"
    state: directory
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0755"
  loop: "{{ nyx_wallpaper_dirs }}"

- name: illogical-impulse directory
  ansible.builtin.file:
    path: "/home/{{ nyx_user }}/.config/illogical-impulse"
    state: directory
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0755"
  when: nyx_ii_shell_config | bool

- name: Shell settings
  ansible.builtin.template:
    src: config.json.j2
    dest: "/home/{{ nyx_user }}/.config/illogical-impulse/config.json"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  when: nyx_ii_shell_config | bool

# --- NyxOS tweaks ---------------------------------------------------------
# Copied after ii, so anything here wins. Mirror the ~/.config tree shape
# under files/ii-overlay/ — e.g. files/ii-overlay/hypr/custom/keybinds.conf.
- name: NyxOS overlay
  ansible.builtin.copy:
    src: ii-overlay/
    dest: "/home/{{ nyx_user }}/.config/"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
    directory_mode: "0755"
  when: nyx_ii_overlay | bool

# ii's config is Lua: hyprland.lua loads internal libraries, then its own
# environment and defaults, then anything in custom/. Landing here means the
# NyxOS values are applied last. The name is fixed by upstream — env.lua, not
# env.conf; a hyprlang file here is silently never read.
- name: Hyprland custom directory
  ansible.builtin.file:
    path: "/home/{{ nyx_user }}/.config/hypr/custom"
    state: directory
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0755"

- name: NyxOS environment
  ansible.builtin.template:
    src: env.lua.j2
    dest: "/home/{{ nyx_user }}/.config/hypr/custom/env.lua"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"

# --- wallpaper ------------------------------------------------------------
# Deployed into the picker directory and referenced by
# background.wallpaperPath in config.json above.
#
# Colours are NOT regenerated here. matugen runs from
# end4-pC scripts/colors/switchwall.sh, which also sets the live wallpaper and
# so needs a running compositor — provisioning has none. The scheme updates
# the first time a wallpaper is chosen from the shell; `switchwall.sh
# --noswitch` is the candidate for doing it headlessly, untested.
- name: Wallpaper
  ansible.builtin.copy:
    src: "{{ nyx_hypr_wallpaper }}"
    dest: "{{ nyx_hypr_wallpaper_path }}"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  when: nyx_hypr_wallpaper | length > 0

- name: Warn when no wallpaper is set
  ansible.builtin.debug:
    msg: >-
      nyx_hypr_wallpaper is empty, so config.json keeps ii's bundled default
      and matugen has nothing of yours to derive a scheme from.
  when: nyx_hypr_wallpaper | length == 0

# --- application config ---------------------------------------------------
- name: Ozone flag files
  ansible.builtin.template:
    src: flags.conf.j2
    dest: "/home/{{ nyx_user }}/.config/{{ item }}-flags.conf"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  loop: "{{ nyx_hypr_flag_files }}"

- name: Spotify on Wayland
  ansible.builtin.copy:
    src: spotify-launcher.conf
    dest: "/home/{{ nyx_user }}/.config/spotify-launcher.conf"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  when: "'spotify-launcher' in nyx_hypr_packages_apps"

# System-wide Firefox policy. Applied before first launch, so a fresh
# install never shows sponsored shortcuts or the onboarding tour, and none of
# it has to be re-clicked after a reinstall. Root-owned: it overrides user
# settings, so it must not be user-writable.
- name: Firefox policy directory
  ansible.builtin.file:
    path: /etc/firefox/policies
    state: directory
    mode: "0755"
  when: "'firefox' in nyx_hypr_packages_apps"
  tags: [firefox]

# Tagged so the policy can be reapplied on its own:
#   ansible-playbook site.yml --tags firefox --ask-become-pass
# Firefox reads this at startup, so it needs a browser restart, not a
# reinstall.
- name: Firefox policies
  ansible.builtin.template:
    src: policies.json.j2
    dest: /etc/firefox/policies/policies.json
    mode: "0644"
  when: "'firefox' in nyx_hypr_packages_apps"
  tags: [firefox]

# Without an explicit preference the portal backend is chosen by whichever
# .portal file sorts first, which breaks screenshare non-deterministically.
# ii installs the KDE portal alongside the Hyprland and GTK ones, so this
# matters more here than it did before.
- name: Portal backend preference
  ansible.builtin.file:
    path: "/home/{{ nyx_user }}/.config/xdg-desktop-portal"
    state: directory
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0755"

- name: Portal backend config
  ansible.builtin.template:
    src: hyprland-portals.conf.j2
    dest: "/home/{{ nyx_user }}/.config/xdg-desktop-portal/hyprland-portals.conf"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"

# Launcher entries for sites used as applications. Written to the user's
# applications directory rather than /usr/share, since they are a personal
# choice rather than something the system provides.
- name: Web app launcher directory
  ansible.builtin.file:
    path: "/home/{{ nyx_user }}/.local/share/applications"
    state: directory
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0755"
  when: nyx_web_apps | length > 0

- name: Web app launchers
  ansible.builtin.template:
    src: webapp.desktop.j2
    dest: "/home/{{ nyx_user }}/.local/share/applications/nyx-{{ item.name | lower | replace(' ', '-') }}.desktop"
    owner: "{{ nyx_user }}"
    group: "{{ nyx_user }}"
    mode: "0644"
  loop: "{{ nyx_web_apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Session desktop entry
  ansible.builtin.copy:
    src: hyprland.desktop
    dest: /usr/share/wayland-sessions/hyprland.desktop
    mode: "0644"

# --- login ----------------------------------------------------------------
- name: greetd directory
  ansible.builtin.file:
    path: /etc/greetd
    state: directory
    mode: "0755"

- name: greetd config
  ansible.builtin.template:
    src: greetd.toml.j2
    dest: /etc/greetd/config.toml
    mode: "0644"
  notify: restart greetd

- name: Enable greetd
  ansible.builtin.systemd_service:
    name: greetd
    enabled: true
