---
# Remote access to the desktop, in two shapes that share one virtual screen.
#
# The point of the headless output is resolution independence: the physical
# display is 5120x1440 and a client is not, so mirroring it scales badly.
# A headless output is a monitor that exists only over the network, at
# whatever size the client actually has.
#
#   hypr-rdp — the whole desktop over RDP. Hardware H.264 through VA-API,
#              PipeWire audio, bidirectional clipboard, and a client already
#              installed on Windows, macOS, iOS and Android.
#   sunshine — for anything where latency is the point. Moonlight clients on
#              phones, tablets, Steam Deck, TVs.
#
# RDP replaced wayvnc here: VNC has no audio, no hardware encoding, and needs
# a third-party client on every platform.

nyx_remote_enabled: false

# hypr-rdp is AUR-only. It is the reason nyx_packages_aur is no longer empty;
# see group_vars/all.yml. sunshine is cachyos, so it stays a repo install.
nyx_remote_packages:
  - sunshine

# Size of the virtual screen. RDP negotiates resolution with the client, so
# this is the initial size rather than a hard limit.
nyx_remote_resolution: "1920x1080"
nyx_remote_refresh: 60

# --- hypr-rdp -------------------------------------------------------------
# Binds to localhost, so reaching it means an SSH tunnel. RDP encrypts
# itself, unlike VNC, so that is defence in depth rather than the only
# protection — but it still means no extra port is exposed. Change the bind
# to 0.0.0.0 only when something else provides the perimeter, such as
# Tailscale or WireGuard.
nyx_rdp_bind: "127.0.0.1"
nyx_rdp_port: 3389

# The port to forward to on the CLIENT, which must not be 3389. Windows
# Remote Desktop listens on 0.0.0.0:3389, which already covers
# 127.0.0.1:3389 — so `ssh -L 3389:...` cannot bind, and mstsc pointed at
# localhost:3389 reaches the client machine itself and reports "you already
# have a console session in progress".
nyx_rdp_local_port: 13389
nyx_rdp_username: "{{ nyx_user }}"

# The password is NOT supplied here or on the command line. It is generated
# fresh on every boot by nyx-rdp-password.service and written to
# ~/.config/hypr-rdp/config.toml at 0600, then shown on an interactive SSH
# login by the fish drop-in.
#
# Reusing the account password was considered and rejected: hypr-rdp stores
# its password in plaintext, while the account password otherwise exists only
# as a hash in /etc/shadow. Generating instead also keeps it out of `ps` and
# shell history, which `-e nyx_rdp_password=...` would not.
#
# It is a second factor rather than the boundary — the service binds to
# localhost, so reaching it already means getting through key-only SSH.

# 30 is upstream's default. Quality is H.264 qp, lower being better.
nyx_rdp_fps: 60
nyx_rdp_bitrate: 20000000
nyx_rdp_quality: 23

# --- sunshine -------------------------------------------------------------
# Brings its own TLS and PIN pairing, so it does not need the tunnel. Its
# ports are a documented range rather than one number, and it is configured
# through a web UI on first run at https://localhost:47990 — including the
# prep commands that create and destroy the headless output. That first-run
# configuration is not automated here.
nyx_remote_sunshine_ui_port: 47990

# Sunshine's own default for origin_web_ui_allowed is "lan", which puts its
# admin interface on the whole network rather than localhost. "pc" restricts
# it to the machine itself, reachable through the same SSH tunnel as RDP.
# Set to "lan" to pair from a phone without a tunnel.
nyx_sunshine_web_ui_origin: "pc"
