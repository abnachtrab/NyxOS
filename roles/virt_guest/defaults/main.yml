---
# Keyed on ansible_virtualization_type. Hyper-V reports "VirtualPC"
# (confirmed on linux-cachyos under Hyper-V Gen 2).
nyx_virt_packages:
  VirtualPC:  [hyperv]
  VMware:     [open-vm-tools]
  kvm:        [qemu-guest-agent, spice-vdagent]
  virtualbox: [virtualbox-guest-utils]

nyx_virt_services:
  VirtualPC:  [hv_fcopy_daemon, hv_kvp_daemon, hv_vss_daemon]
  VMware:     [vmtoolsd]
  kvm:        [qemu-guest-agent]
  virtualbox: [vboxservice]
