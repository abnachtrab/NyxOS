---
- name: Guest tooling per hypervisor
  community.general.pacman:
    name: "{{ nyx_virt_packages[nyx_profile.virt] | default([]) }}"
    state: present
  when: nyx_virt_packages[nyx_profile.virt] is defined

- name: Enable guest services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ nyx_virt_services[nyx_profile.virt] | default([]) }}"
  failed_when: false

- name: Hyper-V framebuffer resolution
  ansible.builtin.debug:
    msg: >-
      Hyper-V has no dynamic resize. Set video=hyperv_drm:1920x1080 on the
      kernel cmdline (older kernels: hyperv_fb). Verify the module name with
      `lsmod | grep hyperv` before hardcoding it.
  when: nyx_profile.virt == 'VirtualPC'
