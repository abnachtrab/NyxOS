---
# Userspace the compositor needs, on top of whatever driver profile chwd
# selects. nvidia-open-dkms covers Turing and newer; chwd picks a legacy
# branch (nvidia-dkms-580xx, -470xx) on older parts, and pacman will not hold
# that and nvidia-open-dkms at once. Override this list for a pre-Turing card.
# lib32-nvidia-utils needs [multilib]; the role asserts it rather than
# enabling it.
nyx_nvidia_packages:
  - nvidia-open-dkms
  - nvidia-utils
  - lib32-nvidia-utils
  - egl-wayland
  # VA-API bridge to NVDEC. conf.d/env.conf sets LIBVA_DRIVER_NAME=nvidia,
  # which resolves to nothing without this — hardware video decode then falls
  # back to software with no error.
  - libva-nvidia-driver

# Early KMS. i915 is prepended when an Intel iGPU is also present: on hybrid
# systems, loading the NVIDIA modules first stalls Electron and Chromium apps
# for up to a minute after boot.
#
# Early KMS can also break resume from hibernation — the machine boots instead
# of resuming. Drop these modules if that shows up.
nyx_nvidia_kms_modules:
  - nvidia
  - nvidia_modeset
  - nvidia_uvm
  - nvidia_drm

# WLR_NO_HARDWARE_CURSORS is obsolete on current drivers and deliberately
# not set; explicit sync landed in the 555 series.
nyx_kernel_cmdline: "quiet nowatchdog"
