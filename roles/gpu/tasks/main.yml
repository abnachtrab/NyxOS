---
# Driver selection is delegated to chwd, CachyOS's hardware detection tool.
# It maintains the generation split that would otherwise be hardcoded here
# (nvidia-open-dkms for Turing+, nvidia-dkms-580xx, nvidia-dkms-470xx for
# legacy parts), plus .prime variants for hybrid laptops, amd, intel,
# nouveau, and non-GPU quirks such as broadcom-wl and handheld profiles.
#
# This role handles the parts chwd does not: the userspace Hyprland needs,
# early KMS, and the modeset flag. Compositor env vars are rendered by
# roles/session_hyprland into illogical-impulse's hypr/custom/env.lua.

- name: Hardware detection tool
  community.general.pacman:
    name: "{{ nyx_gpu_packages }}"
    state: present

- name: List profiles chwd would apply
  ansible.builtin.command: chwd --list
  register: nyx_chwd_list
  changed_when: false
  failed_when: false

- name: Show chwd view of this hardware
  ansible.builtin.debug:
    var: nyx_chwd_list.stdout_lines

# failed_when: false because "no matching profile" is a normal outcome and
# chwd reports it as failure. The result is REPORTED rather than discarded —
# on AMD and Intel machines this is the only step that configures drivers, so
# a silent failure here means no graphics driver and a green play.
- name: Autoconfigure drivers
  ansible.builtin.command: chwd -a
  register: nyx_chwd_run
  changed_when: >-
    'No device of class' not in (nyx_chwd_run.stderr | default(''))
    and 'already installed' not in (nyx_chwd_run.stdout | default(''))
  failed_when: false

- name: Report a chwd failure
  ansible.builtin.debug:
    msg: >-
      WARNING: chwd -a exited {{ nyx_chwd_run.rc }} and did not match
      "no device of class". No driver profile was applied.
      stderr: {{ nyx_chwd_run.stderr | default('') | trim }}
  when:
    - nyx_chwd_run.rc != 0
    - "'No device of class' not in (nyx_chwd_run.stderr | default(''))"

- name: NVIDIA
  when: "'nvidia' in nyx_profile.gpus"
  tags: [nvidia]
  block:

    # lib32-* resolves only with [multilib] enabled. The CachyOS installer
    # enables it, but a pacstrapped system inherits whatever pacman.conf was
    # copied in, so check rather than assume. Asserted, not enabled: this
    # role reads pacman.conf for the same reason roles/base does.
    - name: Read configured repos
      ansible.builtin.shell:
        cmd: |
          grep -oP '^\[\K[^]]+' /etc/pacman.conf || true
      register: nyx_gpu_repos
      changed_when: false
      when: nyx_nvidia_packages | select('match', 'lib32-') | list | length > 0

    - name: Require multilib for the 32-bit driver libraries
      ansible.builtin.assert:
        that: "'multilib' in nyx_gpu_repos.stdout_lines"
        fail_msg: >-
          nyx_nvidia_packages contains lib32-* but [multilib] is not enabled
          in /etc/pacman.conf. Enable it, or drop the lib32 entries from
          nyx_nvidia_packages.
        success_msg: "multilib present"
      when: nyx_gpu_repos.skipped is not defined

    - name: NVIDIA userspace
      community.general.pacman:
        name: "{{ nyx_nvidia_packages }}"
        state: present

    # The Hyprland docs call for this specifically. It is also set on the
    # kernel cmdline below; modprobe.d is the one that takes effect today,
    # because nothing currently reads /etc/kernel/cmdline.
    - name: nvidia_drm modeset via modprobe.d
      ansible.builtin.copy:
        content: "options nvidia_drm modeset=1\n"
        dest: /etc/modprobe.d/nvidia.conf
        mode: "0644"
      notify: rebuild initramfs

    - name: Early KMS modules in mkinitcpio
      ansible.builtin.lineinfile:
        path: /etc/mkinitcpio.conf
        regexp: '^MODULES='
        line: >-
          MODULES=({{ ((['i915'] if 'intel' in nyx_profile.gpus else [])
                       + nyx_nvidia_kms_modules) | join(' ') }})
      notify: rebuild initramfs

    # Written for Phase 10, when a UKI built from an mkinitcpio preset will
    # consume it. Nothing reads it now: install.sh writes refind_linux.conf
    # directly, so this file has no effect on the current boot path.
    - name: nvidia_drm.modeset on the kernel cmdline
      ansible.builtin.lineinfile:
        path: /etc/kernel/cmdline
        regexp: 'nvidia_drm\.modeset'
        line: "{{ nyx_kernel_cmdline }} nvidia_drm.modeset=1"
        create: true
        mode: "0644"
      notify: rebuild initramfs

    # Reads N until the machine has rebooted with the new initramfs. Reported
    # rather than asserted for that reason.
    - name: Is DRM modesetting live?
      ansible.builtin.slurp:
        src: /sys/module/nvidia_drm/parameters/modeset
      register: nyx_nvidia_modeset
      failed_when: false

    - name: DRM modesetting state
      ansible.builtin.debug:
        msg: >-
          nvidia_drm.modeset={{ (nyx_nvidia_modeset.content | b64decode | trim)
                                if nyx_nvidia_modeset.content is defined
                                else 'unreadable (module not loaded yet)' }}
          — expect Y after a reboot.
