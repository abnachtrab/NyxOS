---
# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
nyx_name:        "NyxOS"
nyx_id:          "nyxos"
nyx_user:        "abnac"
nyx_user_groups: [wheel, video, audio, input, storage]
nyx_url:         "https://github.com/abnachtrab/NyxOS"

# SSH keys for nyx_user. roles/base defaults this to empty because the repo
# is public; this file is where the real value belongs.
#
# On VMs roles/base also sets PasswordAuthentication no, so this is the only
# way in over SSH there. A wrong key means VMConnect and its keystroke paste.
nyx_ssh_authorized_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKR2EiQJNKhdf3P5rsVPC4ba0HUrJFMidNFCedDAb0Il"

# ---------------------------------------------------------------------------
# Kernel / packages / shell
# ---------------------------------------------------------------------------
nyx_kernel:         "linux-cachyos"
nyx_kernel_headers: "{{ nyx_kernel }}-headers"
nyx_aur_helper:     "yay"
# fish, configured entirely by illogical-impulse — it ships fish config and
# a starship prompt. Installed in roles/base rather than left to ii, because
# roles/base sets the login shell and runs first.
nyx_shell: /usr/bin/fish

# English (US) UI, qwerty. Mirrors the defaults in scripts/install.sh.
# Glyph coverage beyond Latin comes from illogical-impulse's font set, not
# from anything here.
nyx_locale:   "en_US.UTF-8"
nyx_keymap:   "us"
nyx_timezone: "America/Phoenix"

# Repo sections are configured by the CachyOS installer and read by
# roles/base. nyx_profile.march is used by scripts/install.sh when selecting
# a tier for a from-scratch pacstrap.

nyx_packages_base:
  - base-devel
  - git
  - ansible-core
  - openssh
  - networkmanager
  - sudo
  - rsync
  - man-db
  - pacman-contrib
  - reflector
  - fastfetch
  - kitty
  - fish
  - eza
  - bat
  - fd
  - ripgrep
  - fzf
  - zoxide
  - btop
  - nvtop
  - zip
  - unzip
  - 7zip
  # Used by roles/remote's nyx-headless. It worked only because
  # illogical-impulse happens to install jq — declared here so it does not
  # depend on that.
  - jq
  # roles/detect runs `sbctl status --json`. It fails soft, so a missing
  # binary silently reports secureboot false rather than erroring. Phase 10
  # needs it for real.
  - sbctl
  # Installed, NOT enabled. `ufw enable` defaults to deny-incoming, which
  # drops sshd and locks you out of a headless machine. Allow OpenSSH first.
  - ufw

# Keep this short: it is the least reproducible layer, and one failing build
# aborts the whole run, which is deliberate.
#
# One entry, and only when remote access is on. hypr-rdp is here because no
# repo packages a VNC or RDP server for Hyprland, and wayvnc — the one repo
# alternative — has no audio and no hardware encoding.
#
# onlyoffice-bin and vesktop-bin were briefly listed here and are not: both
# turned out to be in the CachyOS repos. Check `pacman -Si <name>` before
# assuming something is AUR-only. CachyOS carries mpvpaper, sunshine and
# these two, none of which Arch ships.
nyx_packages_aur: >-
  {{ ['hypr-rdp'] if (nyx_remote_enabled | default(false) | bool) else [] }}

# ---------------------------------------------------------------------------
# Remote access (roles/remote)
# ---------------------------------------------------------------------------
# wayvnc for the desktop, sunshine for anything that moves, both on a headless
# output so a client gets its own resolution. Enabling this also turns on
# sshd everywhere, since wayvnc is reached through an SSH tunnel.
#
# null, not true — see nyx_toggles below. null means "not specified",
# which is what lets site.yml tell an unanswered toggle from a chosen one.
nyx_remote_enabled: ~

# ---------------------------------------------------------------------------
# Feature toggles
# ---------------------------------------------------------------------------
# Optional features site.yml asks about when none of them are given on the
# command line. The rule, in full:
#
#   none supplied  — ask y/n for each
#   any supplied   — ask nothing; every unsupplied toggle becomes false
#
# So `-e nyx_remote_enabled=true` alone means remote access and nothing
# else, which is the point: one flag is a complete statement of intent
# rather than a modification of a default nobody typed.
#
# Each entry needs a matching `name: ~` default somewhere, because a
# variable that is genuinely undefined and one that is null both read as
# unspecified, but only a defined one can be relied on by a role.
#
# Adding a feature here is the whole change; site.yml iterates this list.
nyx_toggles:
  - name: nyx_remote_enabled
    prompt: "Remote access: RDP, Sunshine, and sshd"
  - name: nyx_end4pc_enabled
    prompt: "end4-pC Quickshell config on top of illogical-impulse"
  - name: nyx_hypr_proton_wayland
    prompt: "Steam and Proton under Wayland"

# Defaults for the toggles above. null is deliberate; do not set true here.
nyx_end4pc_enabled: ~
nyx_hypr_proton_wayland: ~

# ---------------------------------------------------------------------------
# Backup (roles/backup_rclone)
# ---------------------------------------------------------------------------
nyx_rclone_remote:   "onedrive"     # `rclone config` name — configured manually
nyx_rclone_crypt:    "onedrive-crypt"
nyx_backup_paths:
  - "{{ '/home/' + nyx_user + '/Documents' }}"
  - "{{ '/home/' + nyx_user + '/Projects' }}"
nyx_backup_oncalendar: "daily"
