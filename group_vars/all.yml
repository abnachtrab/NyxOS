---
# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------
nyx_name:        "NyxOS"
nyx_id:          "nyxos"
nyx_user:        "abnac"
nyx_user_groups: [wheel, video, audio, input, storage]
nyx_url:         "https://github.com/abnachtrab/NyxOS"

# ---------------------------------------------------------------------------
# Kernel / packages / shell
# ---------------------------------------------------------------------------
nyx_kernel:         "linux-cachyos"
nyx_kernel_headers: "{{ nyx_kernel }}-headers"
nyx_aur_helper:     "yay"
# fish, configured entirely by illogical-impulse — it ships fish config and
# a starship prompt. Installed in roles/base rather than left to ii, because
# roles/base sets the login shell and runs first.
nyx_shell: /usr/bin/fish

# English (US) UI, qwerty. Mirrors the defaults in scripts/install.sh.
# Glyph coverage beyond Latin comes from illogical-impulse's font set, not
# from anything here.
nyx_locale:   "en_US.UTF-8"
nyx_keymap:   "us"
nyx_timezone: "America/Phoenix"

# Repo sections are configured by the CachyOS installer and read by
# roles/base. nyx_profile.march is used by scripts/install.sh when selecting
# a tier for a from-scratch pacstrap.

nyx_packages_base:
  - base-devel
  - git
  - ansible-core
  - openssh
  - networkmanager
  - sudo
  - rsync
  - man-db
  - pacman-contrib
  - reflector
  - fastfetch
  - kitty
  - fish
  - eza
  - bat
  - fd
  - ripgrep
  - fzf
  - zoxide
  - btop
  - nvtop
  - zip
  - unzip
  - 7zip

# Currently empty. Keep it short if it grows again: this is the least
# reproducible layer, and one failing build aborts the whole run, which is
# deliberate.
nyx_packages_aur: []

# ---------------------------------------------------------------------------
# Backup (roles/backup_rclone)
# ---------------------------------------------------------------------------
nyx_rclone_remote:   "onedrive"     # `rclone config` name — configured manually
nyx_rclone_crypt:    "onedrive-crypt"
nyx_backup_paths:
  - "{{ '/home/' + nyx_user + '/Documents' }}"
  - "{{ '/home/' + nyx_user + '/Projects' }}"
nyx_backup_oncalendar: "daily"
