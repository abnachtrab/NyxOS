[defaults]
inventory          = ./inventory
roles_path         = ./roles
stdout_callback    = default
result_format      = yaml
interpreter_python = /usr/bin/python3
retry_files_enabled = false
host_key_checking  = false
deprecation_warnings = false

[privilege_escalation]
become          = True
become_method   = sudo

# become_ask_pass is deliberately NOT set here. It prompts at startup, before
# any variable is considered, so -e ansible_become_password could not
# suppress it — install.sh prompted for a become password it did not need,
# and accepted anything non-empty.
#
# Whether escalation needs a password at all depends on who is running:
# sudo does not authenticate for uid 0, so a root run never needs
# --ask-become-pass and passing it only asks for a value that is then
# discarded. install.sh runs as root in the chroot and passes nothing.
# scripts/run.ps1 connects over ssh as a normal user and does pass it.
# site.yml states which case is in effect at the top of every run.
#
# Running by hand as a non-root user without it fails with a clear
# "sudo password required" rather than anything subtle.
