[defaults]
inventory          = ./inventory
roles_path         = ./roles
stdout_callback    = default
result_format      = yaml
interpreter_python = /usr/bin/python3
retry_files_enabled = false
host_key_checking  = false
deprecation_warnings = false

[privilege_escalation]
become          = True
become_method   = sudo

# become_ask_pass is deliberately NOT set here. It prompts at startup, before
# any variable is considered, so -e ansible_become_password could not
# suppress it — install.sh prompted for a become password it did not need,
# and accepted anything non-empty.
#
# It was also redundant: every documented way of running this passes
# --ask-become-pass itself (scripts/run.ps1, and the commands in CLAUDE.md).
# Running by hand as a non-root user without it fails with a clear
# "sudo password required" rather than anything subtle.
