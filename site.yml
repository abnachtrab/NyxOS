---
# NyxOS provisioning entrypoint.
#
#   ansible-playbook site.yml --ask-become-pass
#   ansible-playbook site.yml --tags session
#   ansible-playbook site.yml -e @profiles/nvidia-desktop-v4.json  # force a hw path
#
- name: Provision NyxOS
  hosts: localhost
  gather_facts: true

  # No encrypt: here. With it, a blank answer is hashed to the hash of the
  # empty string rather than staying empty, so "blank to skip" silently
  # created the user with an empty password. roles/base hashes it instead,
  # and only when it is actually creating the account.
  #
  # vars_prompt cannot be conditional — it runs before any facts exist — so
  # this is asked even when the user already exists. roles/base reports that
  # and ignores the answer.
  vars_prompt:
    - name: nyx_password
      prompt: "Password for the primary user (ignored if the account exists)"
      private: true
      confirm: true
      unsafe: true

  roles:
    # ---- always ----------------------------------------------------------
    - role: detect
      tags: [always, detect]

    - role: base
      tags: [base]

    # ---- hardware-conditional --------------------------------------------
    # One role; chwd selects the driver profile itself.
    - role: gpu
      when: not (nyx_profile.is_vm | bool)
      tags: [gpu]

    # ---- userland --------------------------------------------------------
    - role: session_hyprland
      tags: [session, hyprland]

    - role: remote
      when: nyx_remote_enabled | bool
      tags: [remote]

    - role: branding
      tags: [branding]

    - role: backup_rclone
      when: not (nyx_profile.is_vm | bool)
      tags: [backup, rclone]

  post_tasks:
    - name: Profile summary
      ansible.builtin.debug:
        var: nyx_profile
      tags: [always]
